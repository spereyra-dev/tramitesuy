# TrámitesUY compose stack (design D-6, §8 Raspberry Pi production profile).
#
# Development (unchanged surface):
#   `docker compose up -d db` (or `make dev`) — a named service resolves with
#   its own profile active, so the dev stack starts exactly as before.
#   Full dev stack: `docker compose --profile dev up --build`.
#
# Production (Raspberry Pi, OPT-11 / design §8):
#   `docker compose --env-file /etc/tramitesuy/.env --profile prod up -d`
#   with an operator-managed .env OUTSIDE this repository (template:
#   .env.example). Under the `prod` profile:
#   - db is reachable ONLY on the internal network (no published 5432);
#   - credentials come from the operator .env via interpolation (defaults are
#     EMPTY — the postgres image refuses to start without a real password,
#     which is the documented fail-safe; no credential is ever committed);
#   - services restart: unless-stopped with healthcheck-based readiness;
#   - api/ingest run the release ARM64 image (`make image-arm64`);
#   - the HTTPS reverse proxy terminates TLS and gates on the internal
#     /ready endpoint (task 41).
# `make check-deploy` asserts the prod profile invariants (config-only).

services:
  # ---- Development profile (unchanged behavior, TRIANGULATE of task 40) ----
  db:
    image: postgres:16-alpine
    profiles: ["dev"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tramitesuy
    ports:
      - "5432:5432"
    volumes:
      - tramitesuy-db-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tramitesuy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    profiles: ["dev"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tramitesuy
      TRAMITESUY_BIND: 0.0.0.0:8080
      TRAMITESUY_DATA_DIR: /app/data
    command: ["/usr/local/bin/api"]
    healthcheck:
      # Port probe via bash's /dev/tcp (the slim runtime image has bash but no
      # curl/wget). Lets the web service depend on api being actually healthy.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 10
    # The api applies the embedded migrations at boot (idempotent), so the
    # full stack self-bootstraps on a fresh database.

  ingest:
    build: .
    profiles: ["dev"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tramitesuy
      CKAN_BASE_URL: https://catalogodatos.gub.uy
      TRAMITESUY_DATA_DIR: /app/data
    command: ["/usr/local/bin/ingest", "daemon"]
    # Daily-loop service mode (IN-1): one pass at boot, then sleep until the
    # configured local run time (default 06:00 America/Montevideo). No web
    # service, no cron orchestration (design §10).

  web:
    build:
      context: ./apps/web
      # Baked at build time (see apps/web/Dockerfile): Next 15 resolves
      # rewrites() during `next build`.
      args:
        API_BASE_URL: http://api:8080
    profiles: ["dev"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Where the same-origin rewrite proxy forwards. The browser still only
      # ever calls the web origin on :3000 — this sets the proxy destination,
      # not the address the UI fetches (web spec, same-origin proxy fetch).
      API_BASE_URL: http://api:8080

  # ---- Production profile (Raspberry Pi; OPT-11, tasks 40/41) ----
  db-prod:
    image: postgres:16-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tramitesuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-tramitesuy}
    volumes:
      # DB_DATA_DIR points at the SSD (design §8) — operator-managed path.
      - ${DB_DATA_DIR:-/srv/tramitesuy/db}:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    # No `ports:` — PostgreSQL is reachable only on the internal network
    # (asserted by `make check-deploy`; never published to the host).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api-prod:
    image: ${TRAMITESUY_IMAGE:-tramitesuy/api:arm64}
    build: .
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      db-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tramitesuy}:${POSTGRES_PASSWORD:-}@db-prod:5432/${POSTGRES_DB:-tramitesuy}
      TRAMITESUY_BIND: 0.0.0.0:8080
      TRAMITESUY_DATA_DIR: /app/data
    command: ["/usr/local/bin/api"]
    # Healthcheck-based readiness: the API reports ready only after the first
    # valid generation snapshot loads (S7 /ready, outside the closed /api/v1
    # inventory). The proxy's own healthcheck gates on the same endpoint, so
    # cold-start traffic is withheld until the catalog can actually be served.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    # No published ports — the proxy reaches the API on the internal network
    # only; the public surface is the HTTPS proxy.

  ingest-prod:
    image: ${TRAMITESUY_IMAGE:-tramitesuy/api:arm64}
    build: .
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      db-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tramitesuy}:${POSTGRES_PASSWORD:-}@db-prod:5432/${POSTGRES_DB:-tramitesuy}
      CKAN_BASE_URL: https://catalogodatos.gub.uy
      TRAMITESUY_DATA_DIR: /app/data
      # Schedule defaults (task 43 rehearses resetting these); overridable
      # from the operator .env.
      INGEST_TZ: ${INGEST_TZ:-America/Montevideo}
      INGEST_AT: ${INGEST_AT:-06:00}
    command: ["/usr/local/bin/ingest", "daemon"]

  proxy:
    image: nginx:1.27-alpine
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      api-prod:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS material (task 41): operator-managed host directory from the
      # operator .env, mounted read-only.
      - ${PROXY_TLS_DIR:-/etc/tramitesuy/tls}:/etc/nginx/tls:ro
      - tramitesuy-proxy-logs:/var/log/nginx
    healthcheck:
      # The proxy is healthy only while it actually serves catalog traffic:
      # the upstream gate (passive health checks against the API's 503
      # cold start) keeps this failing until a valid snapshot is served.
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/api/v1/categories || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

volumes:
  tramitesuy-db-data:
  tramitesuy-proxy-logs:
