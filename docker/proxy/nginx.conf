# TrámitesUY HTTPS reverse proxy (task 41, S13, design §8, OPT-11, R14).
#
# TLS termination happens here: the API container never sees TLS and stays
# on the internal network. The public surface is /api/v1 (read-only
# inventory closed); readiness probes (/ready) and any metrics stay
# internal-only and are never routed through the public listener.
#
# Privacy (R14, audit F10): the access log carries NO query-string field
# and NO client-identifying field. The format below logs the path via $uri
# alone; $args, $query_string, $is_args, $request_uri and $http_referer are
# banned from logging (a referer echoes other sites' URLs, including their
# search query strings), and $remote_addr, $remote_user and $http_user_agent
# are banned too — AGENTS.md permits only query, result, feedback, and
# timestamp. `make check-deploy` asserts this, and the executed rehearsal in
# docs/deploy-raspi.md proves a live search leaves no `q=` in the logs.

user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # The privacy access-log format (R14, audit F10): the deployment-essential
    # fields only — timestamp, method, request URI without query string
    # ($uri), status, bytes sent, and request time. It deliberately omits
    # $remote_addr, $remote_user, and $http_user_agent: the declared privacy
    # policy allows only query, result, feedback, and timestamp.
    log_format  privacy  '[$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent '
                         'rt=$request_time';
    access_log  /var/log/nginx/access.log  privacy;

    sendfile      on;
    keepalive_timeout  65;

    upstream tramitesuy_api {
        # Readiness wiring (TRIANGULATE of task 41): the API answers 503 on
        # every /api/v1 route until the first valid generation snapshot
        # loads (S7 cold start). Two consecutive failed passes mark the
        # peer down for fail_timeout, so the proxy withholds traffic until
        # a valid snapshot is actually served — no routing before the
        # first valid snapshot.
        server  api-prod:8080  max_fails=2  fail_timeout=10s;

        keepalive  16;
    }

    server {
        listen      80;
        listen      [::]:80;
        # TLS-only redirect: the Location header may carry the original
        # path and query (it is the client's own request echoed back, not
        # a server-side log — the banned query-string fields are banned
        # from the access-log FORMAT above, not from the redirect target).
        return  308  https://$host$request_uri;
    }

    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  _;

        # TLS termination material: operator-managed host directory
        # (PROXY_TLS_DIR in the operator .env), mounted read-only.
        ssl_certificate      /etc/nginx/tls/tls.crt;
        ssl_certificate_key  /etc/nginx/tls/tls.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers  on;

        # Probes and metrics stay internal: the API serves them on the
        # unpublished api-prod port, never through the public HTTPS proxy.
        # Neither route is part of the closed /api/v1 inventory.
        location = /ready    { return 404; }
        location = /metrics  { return 404; }

        location /api/v1/ {
            proxy_pass  http://tramitesuy_api;
            proxy_http_version  1.1;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto https;
            # The API's own deadline/admission contract answers 503/504
            # with structured bodies; the proxy passes them through and
            # treats upstream 5xx/timeout as a failed pass (readiness
            # wiring above), never as a cached success.
            proxy_next_upstream  error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout  3s;
            proxy_send_timeout     5s;
            proxy_read_timeout     5s;
        }

        # Everything else is not part of the public surface.
        location /  { return 404; }
    }
}
