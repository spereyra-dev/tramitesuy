[workspace]
resolver = "3"
members = [
    "apps/api",
    "apps/ingest",
    "crates/db",
    "crates/ingestion",
    "crates/search",
    "crates/taxonomy",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.94"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9" # NOTE: archived upstream; revisit before slice (c) if a maintained fork is needed
thiserror = "2.0"
# Async / HTTP
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
# Lock-free snapshot holder (stage 3, design §0): `load_full()` hands each
# request its own strong `Arc`, which doubles as the in-flight retention token.
arc-swap = "1"
# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "json",
] }
# CLI
clap = { version = "4.6", features = ["derive"] }
# Identifiers
uuid = "1"
# Data formats
csv = "1.4"
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
# Deterministic behavior over build speed for the search engine tests.
opt-level = 0
