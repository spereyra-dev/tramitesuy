slug: renovar-cedula
name: Renovar la cédula de identidad
description: "Trámites para la renovación del documento de identidad uruguayo ante la Dirección Nacional de Identificación Civil. El catálogo oficial de la DNIC publica únicamente la primera expedición (607) y la renovación (6538): no existe un trámite nacional explícito de pérdida o duplicado, por lo que una consulta de pérdida, robo o duplicado se orienta hacia la renovación."
category: documentos
keywords:
  - term: renovar
    type: ACTION
    weight: 10
  - term: vencer
    type: ACTION
    weight: 10
  - term: vencimiento
    type: MODIFIER
    weight: 6
  - term: documento
    type: ENTITY
    weight: 8
  - term: identidad
    type: ENTITY
    weight: 8
  - term: duplicado
    type: MODIFIER
    weight: 8
  # Pérdida/robo del documento: la pérdida de la cédula no tiene trámite
  # nacional propio (DNIC solo publica primera vez y renovación), así que la
  # renovación reconoce el vocabulario de extravío para orientar al ciudadano.
  - term: perder
    type: ACTION
    weight: 10
  - term: extraviar
    type: ACTION
    weight: 10
  - term: robar
    type: ACTION
    weight: 8
  # La sinonimia global ya pliega `dni` -> `documento`; la declaración
  # explícita documenta la superficie y su peso queda por debajo del de la
  # primera expedición para no robarle sus consultas de primera cédula.
  - term: dni
    type: ENTITY
    weight: 4
    canonical: documento
  - term: sacar
    type: ACTION
    weight: 12
    negative: true
rules:
  - action: renovar
    entity: documento
    bonus: 15
