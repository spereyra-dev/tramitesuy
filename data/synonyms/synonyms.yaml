# Global synonym surfaces (SE-3, TX-5). These enumerate the noun and
# Rioplatense surfaces the deterministic stem rule (A2) cannot reach:
# the verb conjugations (compre, vendi, robaron) are covered by the
# matcher's stem fallback, but noun forms like `venta`, `autos`,
# `libreta`, and `placas` need an explicit mapping to the canonical term.
synonyms:
  # Vehicle entity surfaces → canonical `vehiculo`
  - term: auto
    canonical: vehiculo
  - term: autos
    canonical: vehiculo
  - term: coche
    canonical: vehiculo
  - term: coches
    canonical: vehiculo
  - term: automovil
    canonical: vehiculo
  - term: automoviles
    canonical: vehiculo
  # Sale noun surfaces → canonical action `vender`
  - term: venta
    canonical: vender
  - term: ventas
    canonical: vender
  # Ownership-transfer noun surfaces → canonical action `transferir`
  - term: transferencia
    canonical: transferir
  - term: traspaso
    canonical: transferir
  - term: cesion
    canonical: transferir
  # Driver's-license surfaces → canonical `licencia`
  - term: libreta
    canonical: licencia
  # License-plate surfaces → canonical `patente`
  - term: placa
    canonical: patente
  - term: placas
    canonical: patente
  # Housing vocabulary → canonical `alquiler`
  - term: arrendamiento
    canonical: alquiler
  - term: arrendamientos
    canonical: alquiler
  # Civil-registry document surfaces → canonical `partida`
  - term: certificado
    canonical: partida
  - term: certificados
    canonical: partida
  # Marriage vocabulary → canonical `matrimonio`
  - term: boda
    canonical: matrimonio
  - term: bodas
    canonical: matrimonio
  - term: casamiento
    canonical: matrimonio
  - term: casamientos
    canonical: matrimonio
  # Consumer-complaint surfaces → canonical action `reclamar` (the stem
  # rule already folds reclamo/reclamos/denuncia/denuncias; the queja
  # family is an irregular surface the stem rule cannot reach).
  - term: queja
    canonical: reclamar
  - term: quejas
    canonical: reclamar
  - term: quejarse
    canonical: reclamar
  # Identity-document noun surfaces → canonical `documento`
  - term: cedula
    canonical: documento
  - term: dni
    canonical: documento
  # Tax regime noun surface → canonical `monotributo`
  - term: monotax
    canonical: monotributo
  # Common misspellings (SE-3): deterministic corrections for frequent
  # typos of catalog keyword terms. Each maps to the canonical term of
  # the intended event so low-literacy queries still land; rare
  # misspellings stay covered by the pg_trgm fuzzy provider.
  - term: sedula
    canonical: documento
  - term: enpadronamiento
    canonical: empadronar
  - term: enpadronar
    canonical: empadronar
  - term: jubilasion
    canonical: jubilacion
  - term: madricula
    canonical: matricula
