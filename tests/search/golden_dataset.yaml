  - query: "donde reclamo por un producto defectuoso"
    expect_top1: consultar-reclamar-o-denunciar-como-consumidor
  - query: "tengo una queja contra la empresa"
    expect_top1: consultar-reclamar-o-denunciar-como-consumidor
