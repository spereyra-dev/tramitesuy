[package]
name = "ingest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ingestion and maintenance CLI (ingest, seed-taxonomy, export-ids)"

[[bin]]
name = "ingest"
path = "src/main.rs"

[lib]
name = "ingest"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
db = { path = "../../crates/db" }
ingestion = { path = "../../crates/ingestion", features = ["live-ckan"] }
sha2.workspace = true
serde_json.workspace = true
sqlx.workspace = true
taxonomy = { path = "../../crates/taxonomy" }
thiserror.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v7"] }

[lints]
workspace = true
