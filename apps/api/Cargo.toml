[package]
name = "api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP API for TrámitesUY (axum router, handlers, DTOs, query redaction)"

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono = "0.4"
db = { path = "../../crates/db" }
regex = "1"
search = { path = "../../crates/search" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
taxonomy = { path = "../../crates/taxonomy" }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
db = { path = "../../crates/db", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
