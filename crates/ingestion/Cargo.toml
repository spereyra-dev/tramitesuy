[package]
name = "ingestion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fixture-driven ingestion pipeline over the official AGESIC procedure catalog (ports + CSV strategy + diffing)"

[dependencies]
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Optional: the ONLY network dependency of this crate, compiled solely under
# the `live-ckan` feature (ckan.rs real fetcher — design D-5 exception).
# Default builds stay network-free: the feature is off unless explicitly
# enabled, so no HTTP code or dependency is compiled by default.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[features]
live-ckan = ["dep:reqwest"]
